name: CI

# Lethe is a POSIX-only codebase (portable BSD sockets, Seatbelt/seccomp
# sandboxing), so CI covers Linux and macOS — not Windows.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-e2e:
    name: ${{ matrix.os }} / ${{ matrix.cpp_compiler }}${{ matrix.gui && ' + GTK3 GUI' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            gui: false
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            gui: true # exercises the optional GTK3 GUI target
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            gui: false

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          if [ "${{ matrix.gui }}" = "true" ]; then
            sudo apt-get install -y libgtk-3-dev
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure CMake
        run: |
          if [ "${{ matrix.gui }}" = "true" ]; then UI=ON; else UI=OFF; fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DBUILD_UI=$UI

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests (ctest)
        working-directory: build
        run: ctest --output-on-failure

      - name: E2E — reference VPN server vs e2e client over real loopback UDP
        run: ./scripts/e2e_vpn_loopback.sh 127.0.0.1 15182

  sanitizer:
    name: ubuntu / clang ASan+UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DBUILD_UI=OFF
          -DBUILD_HARDENED=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Tests under ASan+UBSan
        working-directory: build
        run: ctest --output-on-failure
