name: CI

# lethe_core is POSIX (BSD sockets, Seatbelt/seccomp sandboxing); the
# shells are native per platform: AppKit+WKWebView (macOS), GTK3+WebKitGTK
# (Linux), WebView2 host (Windows, separate job).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-e2e:
    name: ${{ matrix.os }} / ${{ matrix.cpp_compiler }}${{ matrix.gui && ' + GUI' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            gui: false
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            gui: true # exercises the optional GTK3 GUI target
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            gui: true # AppKit + WKWebView shell (no GTK on macOS)

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libseccomp-dev
          if [ "${{ matrix.gui }}" = "true" ]; then
            sudo apt-get install -y libgtk-3-dev
            # Full-web engine: 4.1 API on 24.04+, 4.0 fallback on older.
            sudo apt-get install -y libwebkit2gtk-4.1-dev || \
              sudo apt-get install -y libwebkit2gtk-4.0-dev || true
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure CMake
        run: |
          if [ "${{ matrix.gui }}" = "true" ]; then UI=ON; else UI=OFF; fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DBUILD_UI=$UI

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests (ctest)
        working-directory: build
        run: ctest --output-on-failure

      - name: E2E — reference VPN server vs e2e client over real loopback UDP
        run: ./scripts/e2e_vpn_loopback.sh 127.0.0.1 15182

  sanitizer:
    name: ubuntu / clang ASan+UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libseccomp-dev

      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DBUILD_UI=OFF
          -DBUILD_HARDENED=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Tests under ASan+UBSan
        working-directory: build
        env:
          # The enforced-sandbox test loads a real seccomp default-deny
          # filter into this process; LeakSanitizer's exit-time
          # stop-the-world cannot run under it. ASan memory-error and UBSan
          # checks stay fully active.
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --output-on-failure

  windows-webview:
    name: Windows WebView2 host
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Restore WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.2210.55 -OutputDirectory packages -NonInteractive
          $pkg = Resolve-Path 'packages/Microsoft.Web.WebView2.1.0.2210.55'
          echo "WEBVIEW2_DIR=$pkg" >> $env:GITHUB_ENV
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWEBVIEW2_DIR="${env:WEBVIEW2_DIR}"
      - name: Build lethe-win
        run: cmake --build build --config Release --target lethe-win
