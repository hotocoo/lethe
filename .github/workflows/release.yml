name: Release

# Builds signed, self-contained release artifacts and attaches them to the
# GitHub release for the pushed tag. Triggered automatically on v* tags;
# can also be re-run manually for an existing tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach artifacts to (e.g. v1.0.0)"
        required: true

top-level-permissions: {}
permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  macos:
    name: macOS DMG (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install cmake ninja pkg-config openssl@3 gtk+3
      - name: Configure, build, test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build build -j "$(sysctl -n hw.ncpu)"
          cd build && ctest --output-on-failure
      - name: Package DMG
        run: |
          chmod +x scripts/bundle_mac_libs.sh scripts/package_mac_app.sh
          scripts/package_mac_app.sh build
      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Lethe $TAG" --generate-notes
          gh release upload "$TAG" dist/*.dmg --clobber

  linux:
    name: Linux tarball (${{ matrix.id }})
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, id: ubuntu24.04 }
          - { os: ubuntu-22.04, id: ubuntu22.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build pkg-config \
            libssl-dev zlib1g-dev libseccomp-dev libgtk-3-dev
      - name: Configure, build, test
        run: |
          cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build build-linux -j "$(nproc)"
          cd build-linux && ctest --output-on-failure
      - name: Package tarball
        run: |
          chmod +x scripts/package_linux.sh
          scripts/package_linux.sh build-linux "${{ matrix.id }}"
      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Lethe $TAG" --generate-notes
          gh release upload "$TAG" dist/*.tar.gz --clobber
