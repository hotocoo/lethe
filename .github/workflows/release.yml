name: Release

# Builds signed, self-contained release artifacts and attaches them to the
# GitHub release for the pushed tag. Triggered automatically on v* tags;
# can also be re-run manually for an existing tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach artifacts to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare-release:
    name: Prepare GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Create release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Lethe $TAG" --generate-notes

  macos:
    name: macOS DMG — WebKit (arm64)
    needs: prepare-release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install cmake ninja pkg-config openssl@3
      - name: Configure, build, test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build build -j "$(sysctl -n hw.ncpu)"
          cd build && ctest --output-on-failure
      - name: Package DMG
        run: |
          chmod +x scripts/bundle_mac_libs.sh scripts/package_mac_app.sh
          scripts/package_mac_app.sh build
      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 dist/*.dmg > dist/SHA256SUMS-macos.txt
          gh release upload "$TAG" dist/*.dmg --clobber
          gh release upload "$TAG" dist/SHA256SUMS-macos.txt --clobber

  macos-blink:
    name: macOS DMG — Blink/CEF (arm64)
    needs: prepare-release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install cmake ninja pkg-config openssl@3
      - name: Fetch pinned CEF
        run: |
          chmod +x scripts/fetch_cef.sh
          scripts/fetch_cef.sh
      - name: Build CEF wrapper
        run: |
          cmake -S third_party/cef -B third_party/cef/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DPROJECT_ARCH=arm64
          cmake --build third_party/cef/build --target libcef_dll_wrapper -j "$(sysctl -n hw.ncpu)"
      - name: Configure, build, test
        run: |
          cmake -S . -B build-cef -DCMAKE_BUILD_TYPE=Release -G Ninja \
            -DLETHE_WITH_CEF=ON
          cmake --build build-cef -j "$(sysctl -n hw.ncpu)"
          cd build-cef && ctest --output-on-failure
      - name: Package Blink DMG
        run: |
          chmod +x scripts/bundle_mac_libs.sh scripts/package_cef_mac_app.sh
          scripts/package_cef_mac_app.sh build-cef
      - name: Attach Blink artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 dist/*-blink-*.dmg > dist/SHA256SUMS-macos-blink.txt
          gh release upload "$TAG" dist/*-blink-*.dmg --clobber
          gh release upload "$TAG" dist/SHA256SUMS-macos-blink.txt --clobber

  linux:
    name: Linux tarball (${{ matrix.id }})
    needs: prepare-release
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, id: ubuntu24.04 }
          - { os: ubuntu-22.04, id: ubuntu22.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build pkg-config \
            libssl-dev zlib1g-dev libseccomp-dev libgtk-3-dev
          # Full-web engine: 4.1 API on 24.04+, 4.0 fallback on older.
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev || \
            sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
      - name: Configure, build, test
        run: |
          cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build build-linux -j "$(nproc)"
          cd build-linux && ctest --output-on-failure
      - name: Package tarball
        run: |
          chmod +x scripts/package_linux.sh
          scripts/package_linux.sh build-linux "${{ matrix.id }}"
      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" dist/*.tar.gz --clobber

  windows:
    name: Windows .exe (WebView2)
    needs: prepare-release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Restore WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.2210.55 -OutputDirectory packages -NonInteractive
          $pkg = Resolve-Path 'packages/Microsoft.Web.WebView2.1.0.2210.55'
          echo "WEBVIEW2_DIR=$pkg" >> $env:GITHUB_ENV
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWEBVIEW2_DIR="${env:WEBVIEW2_DIR}"
          cmake --build build --config Release --target lethe-win
      - name: Stage exe
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(lethe VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem -Recurse -Filter lethe-win.exe build | Select-Object -First 1
          Copy-Item $exe.FullName "dist/Lethe-$ver-windows-x64.exe"
      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum dist/*.exe > dist/SHA256SUMS-windows.txt
          gh release upload "$TAG" dist/*.exe --clobber
          gh release upload "$TAG" dist/SHA256SUMS-windows.txt --clobber
