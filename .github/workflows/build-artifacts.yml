name: Build current artifacts

on:
  push:
    branches: ["main", "feat/lethe-webkit-performance-hardening"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS DMG (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install cmake ninja pkg-config openssl@3
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build build -j "$(sysctl -n hw.ncpu)"
          cd build && ctest --output-on-failure
      - name: Package DMG
        run: |
          chmod +x scripts/bundle_mac_libs.sh scripts/package_mac_app.sh
          scripts/package_mac_app.sh build
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: lethe-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error
      - name: Generate checksum
        run: shasum -a 256 dist/*.dmg > dist/SHA256SUMS-macos.txt
      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: lethe-macos-dmg-sha256
          path: dist/SHA256SUMS-macos.txt
          if-no-files-found: error

  windows:
    name: Windows EXE (WebView2)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Restore WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.2210.55 -OutputDirectory packages -NonInteractive
          $pkg = Resolve-Path 'packages/Microsoft.Web.WebView2.1.0.2210.55'
          echo "WEBVIEW2_DIR=$pkg" >> $env:GITHUB_ENV
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWEBVIEW2_DIR="${env:WEBVIEW2_DIR}"
          cmake --build build --config Release --target lethe-win
      - name: Stage EXE
        shell: pwsh
        run: |
          .\scripts\package_windows.ps1 -BuildDir build\Release
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = Get-ChildItem dist\Lethe-*-windows-x64.zip | Select-Object -First 1
          if (-not $zip) { throw 'Windows package was not produced' }
          $stage = Join-Path dist 'Lethe-windows-x64'
          if (-not (Test-Path $stage\Lethe.exe)) { throw 'Packaged Lethe.exe was not produced' }
          # BaseName already strips .zip; appending .exe is required here.
          # The previous regex attempted to replace an extension that was no
          # longer present, producing a file with no extension and causing
          # the upload-artifact glob to find nothing.
          Copy-Item $stage\Lethe.exe (Join-Path dist ($zip.BaseName + '.exe'))
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: lethe-windows-exe
          path: dist/*.exe
          if-no-files-found: error
      - name: Generate checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content -NoNewline dist/SHA256SUMS-windows.txt
      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: lethe-windows-exe-sha256
          path: dist/SHA256SUMS-windows.txt
          if-no-files-found: error
